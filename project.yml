name: DLMSApp
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    ENABLE_USER_SCRIPT_SANDBOXING: NO

targets:
  # ---- 协议核心：vendored Gurux.DLMS.c(客户端子集) + 桥接，编成 framework ----
  DLMSCore:
    type: framework
    platform: iOS
    sources:
      # 仅客户端 src（排除 server 侧），header 由搜索路径提供。
      - path: Sources/DLMSCore/C/src
        excludes: [ "server.c", "serverevents.c", "notify.c" ]
      - path: Sources/DLMSCore/Bridge
      # 桥接头必须作为「public header」进 Headers 构建阶段，才会被复制到
      # DLMSCore.framework/Headers/ 下。否则 framework 自身能编过（靠 HEADER_SEARCH_PATHS），
      # 但 App 侧 `import DLMSCore` 时 Clang 读 framework 内生成的 module.modulemap 会报
      #   module.modulemap:4:21: error: umbrella header 'DLMSCore.h' not found
      # 注意：必须写成 sources 条目并显式指明 buildPhase/headerVisibility
      # （headerVisibility 默认是 public，这里写出来是为了意图明确、避免回退）。
      - path: Sources/DLMSCore/Headers
        buildPhase: headers
        headerVisibility: public
    settings:
      base:
        PRODUCT_MODULE_NAME: DLMSCore
        DEFINES_MODULE: YES
        MODULEMAP_FILE: "$(SRCROOT)/Sources/DLMSCore/Headers/module.modulemap"
        PUBLIC_HEADERS_FOLDER_PATH: "$(PRODUCT_NAME).framework/Headers"
        CLANG_ENABLE_MODULES: YES
        # framework 也必须产出 Info.plist，否则内嵌进 App 后模拟器安装会失败：
        #   Failed to load Info.plist from bundle at
        #     .../DLMSApp.app/Frameworks/DLMSCore.framework
        #   Extra info: Couldn't stat .../DLMSCore.framework/Info.plist
        # Xcode 在「既没有 INFOPLIST_FILE 也没有 GENERATE_INFOPLIST_FILE」时不会生成 plist。
        # framework 用生成式最合适：平台相关键（CFBundleSupportedPlatforms 等）由 Xcode 注入，
        # 手写 plist 反而要自己维护这些键。
        GENERATE_INFOPLIST_FILE: YES
        HEADER_SEARCH_PATHS:
          - "$(SRCROOT)/Sources/DLMSCore/C/include"
          - "$(SRCROOT)/Sources/DLMSCore/Headers"
        OTHER_CFLAGS:
          - "-DDLMS_IGNORE_SERVER"
          - "-DDLMS_IGNORE_SERIALIZER"
          - "-Wno-unused-function"
          - "-Wno-unused-variable"
          # 新版 clang（Xcode 15/16 起的 clang 15+/16+）把下面这些旧式 C 写法
          # 从「警告」改成了「默认错误」。vendored 的 Gurux 源码代码风格较老，
          # 在云端较新的 Xcode 上可能因此中断编译。
          # 这些开关只影响诊断级别，不改变任何代码行为，可以放心长期保留。
          - "-Wno-implicit-function-declaration"
          - "-Wno-implicit-int"
          - "-Wno-int-conversion"
          - "-Wno-incompatible-pointer-types"
          - "-Wno-incompatible-function-pointer-types"
        SKIP_INSTALL: NO

  # ---- iOS App：依赖 DLMSCore framework ----
  DLMSApp:
    type: application
    platform: iOS
    sources:
      - path: DLMSApp
      - path: Sources/DLMSModels
      - path: Sources/DLMSBridge
    dependencies:
      - target: DLMSCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.DLMSApp
        PRODUCT_NAME: DLMSApp
        # 用仓库里的显式 Info.plist，而不是 GENERATE_INFOPLIST_FILE 合成。
        # 原因：合成方式在 CI 上产出的 .app 没有 Info.plist，模拟器安装直接失败：
        #   Testing failed: App installation failed: Unable to Install "DLMS抄表"
        #   Failed to load Info.plist from bundle at .../DLMSApp.app/Info.plist
        # 而托管单测（@testable import DLMSApp）必须先装上宿主 App，
        # 所以这一步会连带把 Swift 单测一起弄挂。
        INFOPLIST_FILE: DLMSApp/Info.plist
        # App 图标走 Assets.xcassets 的 AppIcon（单尺寸 1024²，Xcode 14+ 会自动生成各档位）。
        # 资源目录在 `DLMSApp/` 下，被上面 sources 的整目录条目自动收进来，无需单独声明。
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        CURRENT_PROJECT_VERSION: 2
        MARKETING_VERSION: "1.1"

  # ---- 托管单测（宿主 DLMSApp，@testable import DLMSApp）----
  DLMSAppTests:
    type: bundle.unit-test
    platform: iOS
    hostApplication: DLMSApp
    sources:
      - path: Tests/SwiftTests
    dependencies:
      - target: DLMSApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.DLMSAppTests
        # 同样用显式 Info.plist：GENERATE_INFOPLIST_FILE 在本工程组合下产出过没有 plist 的 bundle。
        INFOPLIST_FILE: Tests/SwiftTests/Info.plist

schemes:
  DLMSApp:
    build:
      targets:
        DLMSApp: all
        DLMSAppTests: [test]
    test:
      targets:
        - DLMSAppTests